    <text x="44" y="124" fill="#6e5b62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" letter-spacing="1">AI · PRODUCT · CODE</text>
