<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">0lidaxiang — AI, Product and Code</title>
  <desc id="desc">A warm sunset-inspired banner for the 0lidaxiang GitHub profile.</desc>
  <defs>
